[project]
name = "tema-ops"
version = "0.1.0"
description = "Operations backend for Tema, a fast-food chain in Tbilisi: Wolt order data, reports, alerts, and an AI that answers questions with read-only SQL"
readme = "README.md"
authors = [
    { name = "auplisas", email = "aupli16@freeuni.edu.ge" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-google-genai>=4.4.3",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
